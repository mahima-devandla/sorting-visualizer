<!DOCTYPE html>


<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualizer</title>
    
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://kit.fontawesome.com/cebedaac72.js" crossorigin="anonymous"></script>

</head>
<body>
    <header>
        <nav>
            <button id="a_generate">Generate random Array!</button>
            <div class="array-inputs">
                <div class="size">
                    <p>Size</p>
                    <input id="a_size" type="range" min=20 max=150 step=1 value=20>
                </div>
                <div class="speed">
                    <p>Speed</p>
                    <input id="a_speed" type="range" min=1 max=5 step=1 value=4>
                </div>
            </div>

            <div class="header_right">
                <!-- <p class="nav-heading">Sorting visualizer</p> -->

                <div class="algos">
                    <div class="btn"><button >Bubble</button></div>
                    <div class="btn"><button >Selection</button></div>
                    <div class="btn"><button >Insertion</button></div>
                    <div class="btn"><button >Merge</button></div>
                    <div class="btn"><button >Quick</button></div>
                    <div class="btn"><button >Heap</button></div>
                </div>
            </div>

        </nav>
    </header>
    
    <!-- how to instructions for opertaing the sorting visualizer -->
    <button class="howto" id="howto"><i class="far fa-question-circle"></i></button>
    <div class="how-box" id="how-box">
        <h1>Instructions to customise array</h1>
        <ul class="list">
            <li><p>The min size of the array must be 10</p></li>
            <li><p>The array values must be seperated by comma</p></li>
            <li><p>Range of array values must be between 20 and 100</p></li>
        </ul>
    </div>
    <div class="black-bg" id="black-bg"></div>

    <section>

        <div id="Info_Cont1">
            
        </div>

        <div id="array_container">
            
        </div>

        <div id="Info_Cont2">
           
        </div>

    </section>

    <footer>

    </footer>
    <!-- error box appears when array size is not equal to array elements input size -->
    <div class="error-box" id="error-box">
        <!-- <h1>There is one of the below errors in the custom sorting box:</h1>
        <ul>
            <li>1. The array size is not equal to number of elements entered</li>
            <li>2. The elements are not seprarated by perfect commas</li>
        </ul> -->
    </div>

    <!-- custom input section -->
    <section class="custom">
        
        <div class="custom-box">
            <div class="custom-input">
                <p >Array Size</p>
                <input type="number" class="input1" id="custom-size">
            </div>
            <div class="custom-input">
                <p>Enter the array</p>
                <input type="text" class="input1" id="custom-array">
            </div>
            <button class="custom-button" id="custom-button">Generate Array!</button>
        </div>
        <button class="toggle-btn" id="toggle-btn"><i class="fas fa-arrow-right"></i></button>
    </section>

    <script src="./scripts/main.js"></script>   <!--This should be at the end of body and should be loaded before sorts.js-->
    <script src="./scripts/visualizations.js"></script>  <!--This should be loaded after main.js-->

    <script src="./scripts/bubble_sort.js"></script>
    <script src="./scripts/selection_sort.js"></script>
    <script src="./scripts/insertion_sort.js"></script>
    <script src="./scripts/merge_sort.js"></script>
    <script src="./scripts/quick_sort.js"></script>
    <script src="./scripts/heap_sort.js"></script>

</body>



</html>
